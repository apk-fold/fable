name: Compiler l'APK Fable

on:
  push:
    branches: [main]
    paths-ignore: ['fable.apk', 'README.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dépendances
        run: |
          mkdir -p /tmp/logs
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee /tmp/logs/npm.log

      - name: Tests du moteur de calcul
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/logs/tests.log

      - name: Build web
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/logs/build.log

      - name: Projet Android
        run: |
          set -o pipefail
          if [ ! -d android ]; then npx cap add android 2>&1 | tee /tmp/logs/cap-add.log; echo "NEW_ANDROID=1" >> $GITHUB_ENV; fi

      - name: Synchronisation Android
        env:
          FABLE_BUILD: ${{ github.run_number }}
        run: |
          set -o pipefail
          npx cap sync android 2>&1 | tee /tmp/logs/sync.log
          node scripts/patch-android.mjs 2>&1 | tee -a /tmp/logs/sync.log

      - name: Compiler l'APK
        working-directory: android
        env:
          FABLE_KEYSTORE_B64: ${{ secrets.FABLE_KEYSTORE_B64 }}
          FABLE_KEYSTORE_PASSWORD: ${{ secrets.FABLE_KEYSTORE_PASSWORD }}
          FABLE_KEY_PASSWORD: ${{ secrets.FABLE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          # Clé de signature : secret du dépôt (mises à jour sans désinstaller), sinon clé temporaire.
          if [ -n "$FABLE_KEYSTORE_B64" ]; then
            echo "$FABLE_KEYSTORE_B64" | base64 -d > /tmp/fable.jks
            echo "SIGNING=stable" >> $GITHUB_ENV
          else
            keytool -genkeypair -noprompt -keystore /tmp/fable.jks -storetype JKS -alias fable -keyalg RSA -keysize 2048 -validity 36500 -storepass fable-apk-fold -keypass fable-apk-fold -dname "CN=Fable (signature temporaire)"
            echo "SIGNING=temporary" >> $GITHUB_ENV
            echo "::warning::Secret FABLE_KEYSTORE_B64 absent : APK signé avec une clé temporaire."
          fi
          export FABLE_KEYSTORE_PATH=/tmp/fable.jks
          [ -z "$FABLE_KEYSTORE_PASSWORD" ] && unset FABLE_KEYSTORE_PASSWORD
          [ -z "$FABLE_KEY_PASSWORD" ] && unset FABLE_KEY_PASSWORD
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/logs/gradle.log
          rm -f /tmp/fable.jks

      - name: Captures d'écran de l'interface
        continue-on-error: true
        run: |
          npm install --no-save --no-audit --no-fund playwright@^1.56.0 > /tmp/logs/playwright-install.log 2>&1
          npx playwright install --with-deps chromium >> /tmp/logs/playwright-install.log 2>&1
          (npx vite preview --port 4173 --strictPort > /tmp/logs/preview.log 2>&1 &)
          sleep 4
          node tests/ui-smoke.mjs http://localhost:4173/ /tmp/logs/shots 2>&1 | tee /tmp/logs/ui-smoke.log

      - name: Journal de compilation (branche ci-log)
        if: always()
        run: |
          cd /tmp/logs
          tail -n 400 gradle.log > gradle-tail.log 2>/dev/null || true
          git init -q && git checkout -q -b ci-log
          git config user.name github-actions && git config user.email actions@users.noreply.github.com
          echo "build ${{ github.run_number }} — ${GITHUB_SHA::7}" > BUILD.txt
          git add -A && git commit -qm "log build ${{ github.run_number }}" || true
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log || true

      - name: Récupérer l'APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk fable.apk
          sha256sum fable.apk | tee fable.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: fable-apk
          path: fable.apk

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          NOTE="APK compilé automatiquement (${GITHUB_SHA::7}). SHA-256 : $(cut -d' ' -f1 fable.sha256)"
          if [ "$SIGNING" = "temporary" ]; then NOTE="$NOTE — ⚠️ Signature temporaire : ajoute le secret FABLE_KEYSTORE_B64 au dépôt pour que les versions suivantes s'installent par-dessus."; fi
          gh release create "$TAG" fable.apk --title "Fable 1.${{ github.run_number }}" --notes "$NOTE" --latest

      - name: Enregistrer l'APK dans le dépôt
        run: |
          cp fable.apk /tmp/fable.apk
          cp package-lock.json /tmp/package-lock.json 2>/dev/null || true
          [ "$NEW_ANDROID" = "1" ] && cp -r android /tmp/android-src || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main && git reset -q --hard origin/main
          cp /tmp/fable.apk fable.apk
          [ -f package-lock.json ] || cp /tmp/package-lock.json package-lock.json 2>/dev/null || true
          if [ "$NEW_ANDROID" = "1" ] && [ ! -d android ]; then cp -r /tmp/android-src android; fi
          git add -f fable.apk
          git add package-lock.json android 2>/dev/null || true
          git commit -m "APK Fable (build ${{ github.run_number }}) [skip ci]" || exit 0
          git push origin HEAD:main
